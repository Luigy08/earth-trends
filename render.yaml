# Render Blueprint for the backend. The web app stays on Firebase Hosting.
# Values marked `sync: false` are secrets: Render asks for them when the Blueprint is first applied and they never live in the repo.
#
# One thing a Blueprint cannot declare: the Google service account key. Add it to the web service as a Secret File named
# `google-credentials.json` (Render mounts it at /etc/secrets/). It gives the server Firestore, Firebase Auth token
# verification and Vertex AI (Gemini). Grant that account only: Cloud Datastore User, Vertex AI User, and
# Firebase App Check Token Verifier if ENFORCE_APP_CHECK is turned on.

envVarGroups:
  - name: earth-trends-backend
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: GCLOUD_PROJECT
        value: earth-trend-detective
      - key: VERTEX_LOCATION
        value: global

services:
  - type: web
    name: earth-trends-api
    runtime: node
    # Pick the region closest to the PostgreSQL database and Firestore.
    region: oregon
    # The free plan sleeps when idle, which would stop the analysis worker.
    plan: starter
    # A single instance: the in-process analysis worker and the transactional quotas assume it, as MAX_INSTANCES=1 did.
    numInstances: 1
    buildCommand: npm --prefix functions ci --include=dev && npm --prefix functions run build
    startCommand: node functions/lib/functions/src/server.js
    healthCheckPath: /healthz
    envVars:
      - fromGroup: earth-trends-backend
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/google-credentials.json
      # Comma-separated origins allowed to call the API. Add a Hosting preview channel URL here to test one.
      - key: CORS_ORIGINS
        value: https://earth-trend-detective.web.app,https://earth-trend-detective.firebaseapp.com
      - key: ENFORCE_APP_CHECK
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: METEOMATICS_USERNAME
        sync: false
      - key: METEOMATICS_PASSWORD
        sync: false
      - key: EARTHDATA_USERNAME
        sync: false
      - key: EARTHDATA_PASSWORD
        sync: false

  # Balam ingestion: stores what NASA AppEEARS and Meteomatics have finished, then requests the next blocks.
  # Minute 15 of every hour; the schedule is UTC, which an hourly run does not depend on.
  - type: cron
    name: earth-trends-ingest
    runtime: node
    region: oregon
    plan: starter
    schedule: "15 * * * *"
    buildCommand: npm --prefix functions ci --include=dev && npm --prefix functions run build
    startCommand: node functions/lib/functions/src/scripts/run-ingest.js
    envVars:
      - fromGroup: earth-trends-backend
      - key: DATABASE_URL
        sync: false
      - key: METEOMATICS_USERNAME
        sync: false
      - key: METEOMATICS_PASSWORD
        sync: false
      - key: EARTHDATA_USERNAME
        sync: false
      - key: EARTHDATA_PASSWORD
        sync: false
